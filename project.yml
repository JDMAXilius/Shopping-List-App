# XcodeGen spec — regenerate with: ~/tools/xcodegen/bin/xcodegen generate
# (XcodeGen 2.46.0; binary release, no Homebrew needed)
name: Bagged
options:
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    PRODUCT_BUNDLE_IDENTIFIER: app.bagged
    CODE_SIGN_STYLE: Automatic
packages:
  Core:
    path: Packages/Core
  Catalog:
    path: Packages/Catalog
  Data:
    path: Packages/Data
  DesignKit:
    path: Packages/DesignKit
  # Test-only: never linked into the app target (ARCHITECTURE.md's three-runtime-dependency
  # rule governs what ships, not what tests it).
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing
    from: 1.18.0
targets:
  Bagged:
    type: application
    platform: iOS
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    preBuildScripts:
      - name: Check scan config
        basedOnDependencyAnalysis: false
        script: |
          # A missing key and a missing account produce the same "signed out" message,
          # so a misconfigured App Store build would blame the user's account. Ship
          # builds must carry the config; dev builds only warn.
          if [ -z "${SCAN_RECEIPT_ENDPOINT}" ] || [ -z "${SUPABASE_ANON_KEY}" ]; then
            if [ "${CONFIGURATION}" = "Release" ]; then
              echo "error: SCAN_RECEIPT_ENDPOINT / SUPABASE_ANON_KEY missing — fill Config/Secrets.xcconfig (see the template). A Release build without them ships a scanner that blames the user's account."
              exit 1
            else
              echo "warning: scan config absent — this build takes the signed-out scan path (fill Config/Secrets.xcconfig to reach the function)"
            fi
          fi
    sources:
      - path: App
        excludes:
          - "**/*Tests.swift"
    dependencies:
      - package: Core
      - package: Catalog
      - package: Data
      - package: DesignKit
    entitlements:
      path: App/Bagged.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.bagged
    info:
      path: App/Info.plist
      properties:
        UILaunchScreen: {}
        NSCameraUsageDescription: >-
          Bagged uses your camera to photograph a receipt or scan a barcode so
          the items and prices on it can go straight onto your list.
        ScanReceiptEndpoint: $(SCAN_RECEIPT_ENDPOINT)
        SupabaseAnonKey: $(SUPABASE_ANON_KEY)
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
  BaggedTests:
    type: bundle.unit-test
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.bagged.tests
    sources:
      - path: App
        includes:
          - "**/*Tests.swift"
        excludes:
          - "UITests/**"
    dependencies:
      - target: Bagged
      - package: SnapshotTesting
  BaggedUITests:
    type: bundle.ui-testing
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.bagged.uitests
        GENERATE_INFOPLIST_FILE: YES
    sources:
      - path: App/UITests
    dependencies:
      - target: Bagged
schemes:
  Bagged:
    build:
      targets:
        Bagged: all
    test:
      targets:
        - BaggedTests
        - BaggedUITests
