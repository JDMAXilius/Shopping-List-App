# XcodeGen spec — regenerate with: ~/tools/xcodegen/bin/xcodegen generate
# (XcodeGen 2.46.0; binary release, no Homebrew needed)
name: Bagged
options:
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    PRODUCT_BUNDLE_IDENTIFIER: app.bagged
    CODE_SIGN_STYLE: Automatic
packages:
  Core:
    path: Packages/Core
  Catalog:
    path: Packages/Catalog
  Data:
    path: Packages/Data
  DesignKit:
    path: Packages/DesignKit
  # Test-only: never linked into the app target (ARCHITECTURE.md's three-runtime-dependency
  # rule governs what ships, not what tests it).
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing
    from: 1.18.0
targets:
  Bagged:
    type: application
    platform: iOS
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    preBuildScripts:
      - name: Check scan config
        basedOnDependencyAnalysis: false
        script: |
          # A missing key and a missing account produce the same "signed out" message,
          # so a misconfigured App Store build would blame the user's account. Ship
          # builds must carry the config; dev builds only warn.
          if [ -z "${SCAN_RECEIPT_ENDPOINT}" ] || [ -z "${SUPABASE_ANON_KEY}" ]; then
            if [ "${CONFIGURATION}" = "Release" ]; then
              echo "error: SCAN_RECEIPT_ENDPOINT / SUPABASE_ANON_KEY missing — fill Config/Secrets.xcconfig (see the template). A Release build without them ships a scanner that blames the user's account."
              exit 1
            else
              echo "warning: scan config absent — this build takes the signed-out scan path (fill Config/Secrets.xcconfig to reach the function)"
            fi
          fi
    sources:
      - path: App
        excludes:
          - "**/*Tests.swift"
      # App target, not an extension: the intents call ListDerivation.addPlan and ListCatalog,
      # which are @MainActor app-target types. An extension would compile a second copy of them.
      # Schema27 is Apple's .reminders cluster, parked for iOS 27 — see its README.
      - path: Intents
        excludes:
          - "Schema27/**"
          - "**/*Tests.swift"
    dependencies:
      - package: Core
      - package: Catalog
      - package: Data
      - package: DesignKit
      - target: BaggedWidget
    entitlements:
      path: App/Bagged.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.bagged
    info:
      path: App/Info.plist
      properties:
        UILaunchScreen: {}
        NSCameraUsageDescription: >-
          Bagged uses your camera to photograph a receipt or scan a barcode so
          the items and prices on it can go straight onto your list.
        ScanReceiptEndpoint: $(SCAN_RECEIPT_ENDPOINT)
        SupabaseAnonKey: $(SUPABASE_ANON_KEY)
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
  # Own process. It reads the App Group database and never migrates it — only the app does
  # (AppDatabase.swift) — and the two shared List files come in as sources rather than being
  # re-implemented: two copies of the seeded-estimate currency rule is how a widget starts
  # quoting US seeds to a UK kitchen.
  BaggedWidget:
    type: app-extension
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.bagged.widget
    sources:
      - path: Widget
        excludes:
          - "**/*Tests.swift"
      - path: App/Features/List/ListCatalog.swift
      - path: App/Features/List/ListDerivation.swift
    dependencies:
      - package: Core
      - package: Catalog
      - package: Data
      - package: DesignKit
    entitlements:
      path: Widget/BaggedWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.bagged
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Bagged
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  # An .appex cannot host unit tests and @main cannot live in a test bundle, so the widget's
  # sources are compiled into the test target instead of linked.
  WidgetTests:
    type: bundle.unit-test
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.bagged.widgettests
    sources:
      - path: Widget
        excludes:
          - BaggedWidget.swift
      - path: App/Features/List/ListCatalog.swift
      - path: App/Features/List/ListDerivation.swift
    dependencies:
      - package: Core
      - package: Catalog
      - package: Data
      - package: DesignKit

  BaggedTests:
    type: bundle.unit-test
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.bagged.tests
    sources:
      - path: App
        includes:
          - "**/*Tests.swift"
        excludes:
          - "UITests/**"
      - path: Intents
        includes:
          - "**/*Tests.swift"
        excludes:
          - "Schema27/**"
    dependencies:
      - target: Bagged
      - package: SnapshotTesting
  BaggedUITests:
    type: bundle.ui-testing
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.bagged.uitests
        GENERATE_INFOPLIST_FILE: YES
    sources:
      - path: App/UITests
    dependencies:
      - target: Bagged
schemes:
  Bagged:
    build:
      targets:
        Bagged: all
    test:
      targets:
        - BaggedTests
        - WidgetTests
        - BaggedUITests
